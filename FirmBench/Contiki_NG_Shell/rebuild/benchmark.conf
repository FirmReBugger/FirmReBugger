BENCHMARK_ID=contiki-ng-shell
VARIANT_KIND=firmbench
# NOT the same image as the other Contiki-NG recipes: the checked-in ELF's
# .comment section reports "GNU Arm Embedded Toolchain 10.3-2021.10", not the
# GCC 5.2.1 in contiker/contiki-ng:f823e6a1. This tag is the CI image pinned
# at the exact Contiki-NG commit that upgraded to that toolchain
# (f4c4bb5a9d39, "Updated gcc on Dockerfile"). See rebuild/README.md.
DOCKER_IMAGE=docker.io/contiker/contiki-ng@sha256:ea3aba45b9c58f240db200bceb14c78123fd676274607ebef2cffda89165c1ca
PLATFORM=linux/386
CACHE_NAMESPACE=contiki-v4.9-shell
BASE_COMMIT=c20b12cd2db707d6c07918f8b26cfeb52cf298ca
REVERT_COMMITS=""
BACKPORT_COMMITS=""
EXAMPLE=libs/shell
APPLICATION=example
TARGET=cc2538dk
# No cc2538_read.patch here (unlike every other cc2538 recipe): the
# reference's `read()` matches the stock DMA-based radio driver, not the
# simplified version that patch installs. See rebuild/README.md.
PATCHES="cc2538_norom.patch"
# lpm_enter is NOT patched here, unlike every other cc2538 recipe -- the
# checked-in ELF keeps its real prologue. See rebuild/README.md.
EARLY_RETURNS="fade"
OUTPUT_ELF=contiki_shell.elf
REFERENCE_REL=../contiki_shell.elf
